name: Build Android APK

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install workloads
        run: dotnet workload install maui-android

      - name: Restore
        run: dotnet workload restore OpenUtauMobile/OpenUtauMobile.csproj

      - name: Build APK
        run: |
          dotnet publish OpenUtauMobile/OpenUtauMobile.csproj \
            -c Release \
            -f net9.0-android \
            -o ./artifacts

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenLoid-Flame
          path: artifacts/*.apk
